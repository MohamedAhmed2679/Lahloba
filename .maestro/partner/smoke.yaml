# Partner app smoke test: dev-stub sign-in (CI only), role switch, chef menu.
appId: com.lahloba.partner
name: Partner — sign in, switch to chef role, orders, kitchen times, menu
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "auth-identifier"
    timeout: 90000
- takeScreenshot: partner-01-sign-in
- tapOn:
    id: "auth-identifier"
- inputText: "sample-chef-a"
- tapOn:
    id: "auth-title"
- tapOn:
    id: "auth-send"
- extendedWaitUntil:
    visible:
      id: "auth-code"
    timeout: 15000
- tapOn:
    id: "auth-code"
- inputText: "123456"
- tapOn:
    id: "auth-title"
- tapOn:
    id: "auth-verify"
- extendedWaitUntil:
    visible:
      id: "switch-CHEF"
    timeout: 30000
- takeScreenshot: partner-02-roles
- tapOn:
    id: "switch-CHEF"
- extendedWaitUntil:
    visible:
      id: "chef-workspace"
    timeout: 30000
- takeScreenshot: partner-03-chef-orders
- tapOn:
    id: "tab-times"
- extendedWaitUntil:
    visible: ".*work units booked.*"
    timeout: 30000
- takeScreenshot: partner-04-kitchen-times
- tapOn:
    id: "tab-menu"
- extendedWaitUntil:
    visible: "Molokhia with chicken"
    timeout: 30000
- takeScreenshot: partner-05-chef-menu
