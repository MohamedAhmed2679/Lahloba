version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: lahloba-postgres
    environment:
      POSTGRES_DB: lahloba
      POSTGRES_USER: lahloba
      POSTGRES_PASSWORD: lahloba_secret
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lahloba"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lahloba-redis
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.8.0
    container_name: lahloba-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9092:9092"]
    volumes:
      - kafkadata:/bitnami/kafka
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: lahloba-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: lahloba-mailhog
    ports: ["1025:1025", "8025:8025"]
    restart: unless-stopped

  # Create MinIO bucket on startup
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/lahloba-media --ignore-existing;
      mc anonymous set download local/lahloba-media;
      echo 'MinIO bucket ready';
      "

volumes:
  pgdata:
  redisdata:
  kafkadata:
  miniodata:
