openapi: 3.1.0
info:
  title: Lahloba API
  version: 1.0.0
  description: Bold & energetic food marketplace with transparent ingredient sourcing
servers:
  - url: https://api.lahloba.com/v1
  - url: http://localhost:3000/v1
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    Money:
      type: object
      properties:
        amount_minor: { type: integer }
        currency: { type: string, example: EGP }
      required: [amount_minor, currency]
    OrderPricing:
      type: object
      properties:
        chef_service_fee: { $ref: '#/components/schemas/Money' }
        ingredients_total: { $ref: '#/components/schemas/Money' }
        delivery_fees:
          type: object
          properties:
            ingredients_run_fee: { $ref: '#/components/schemas/Money' }
            meal_run_fee: { $ref: '#/components/schemas/Money' }
        platform_fee: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
        correlation_id: { type: string }

paths:
  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Request OTP
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string, example: "+201000000001" }
                email: { type: string }
      responses:
        200:
          description: OTP sent
  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP and get tokens
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string }
                code: { type: string, example: "000000" }
              required: [code]
      responses:
        200:
          description: JWT tokens + user info
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        200:
          description: New access token
  /meals:
    get:
      tags: [Meals]
      summary: List meals
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: type
          in: query
          schema: { type: string, enum: [COOKED, READY_TO_COOK] }
        - name: chef_id
          in: query
          schema: { type: string }
      responses:
        200:
          description: Paginated list of meals
  /meals/{id}:
    get:
      tags: [Meals]
      summary: Get meal details with ingredients
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Meal with ingredients
  /ingredient-combos/compute:
    post:
      tags: [Ingredients]
      summary: Compute CHEAPEST and FASTEST combos
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                meal_id: { type: string }
                servings: { type: integer }
                address_id: { type: string }
                scheduled_at: { type: string, format: date-time }
              required: [meal_id, servings, address_id, scheduled_at]
      responses:
        200:
          description: Both combo options with pricing and ETA
  /orders:
    post:
      tags: [Orders]
      summary: Create order
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id: { type: string }
                chef_id: { type: string }
                meal_id: { type: string }
                servings: { type: integer, minimum: 1 }
                ingredient_source: { type: string, enum: [CHEF, STORES] }
                ingredient_combo_mode: { type: string, enum: [CHEAPEST, FASTEST] }
                scheduled_at: { type: string, format: date-time }
                address_id: { type: string }
                pricing: { $ref: '#/components/schemas/OrderPricing' }
              required: [customer_id, chef_id, meal_id, servings, ingredient_source, scheduled_at, address_id, pricing]
      responses:
        201:
          description: Order created
    get:
      tags: [Orders]
      summary: List orders
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: status
          in: query
          schema: { type: string }
      responses:
        200:
          description: Paginated orders
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Full order with fulfillments, tasks, payments
    patch:
      tags: [Orders]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string }
      responses:
        200:
          description: Updated order
  /delivery/tasks:
    get:
      tags: [Delivery]
      summary: List delivery tasks
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [AVAILABLE, ASSIGNED, IN_PROGRESS, COMPLETED, CANCELLED] }
      responses:
        200:
          description: Delivery tasks
  /delivery/tasks/{id}/accept:
    post:
      tags: [Delivery]
      summary: Accept a delivery task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Task accepted
  /delivery/stops/{id}/confirm:
    post:
      tags: [Delivery]
      summary: Confirm stop with OTP
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                otp: { type: string }
              required: [otp]
      responses:
        200:
          description: Stop confirmed
  /chat/rooms:
    get:
      tags: [Chat]
      summary: List chat rooms
      responses:
        200:
          description: Chat rooms
  /chat/rooms/{id}/messages:
    get:
      tags: [Chat]
      summary: Get messages in room
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
      responses:
        200:
          description: Paginated messages
    post:
      tags: [Chat]
      summary: Send a message
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                message_type: { type: string, enum: [TEXT, IMAGE] }
      responses:
        201:
          description: Message sent
  /payments/intent:
    post:
      tags: [Payments]
      summary: Create payment intent
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id: { type: string }
                method: { type: string, enum: [CARD, WALLET] }
                amount_minor: { type: integer }
              required: [order_id, method, amount_minor]
      responses:
        201:
          description: Payment intent created
  /ratings:
    post:
      tags: [Ratings]
      summary: Submit rating
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id: { type: string }
                chef_score: { type: integer, minimum: 1, maximum: 5 }
                delivery_score: { type: integer, minimum: 1, maximum: 5 }
                meal_score: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
              required: [order_id]
      responses:
        201:
          description: Rating submitted
  /support/tickets:
    post:
      tags: [Support]
      summary: Create support ticket
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id: { type: string }
                category: { type: string }
                message: { type: string }
              required: [order_id, category, message]
      responses:
        201:
          description: Ticket created
  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      responses:
        200:
          description: User profile
    patch:
      tags: [Users]
      summary: Update profile
      responses:
        200:
          description: Updated profile
