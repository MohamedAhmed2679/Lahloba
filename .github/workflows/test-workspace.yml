name: Lahloba Test Workspace

on:
  push:
    branches: [ "main", "dev", "test" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test-mobile:
    name: Flutter Mobile Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          
      - name: Install Dependencies
        working-directory: ./apps/mobile
        run: flutter pub get
        
      - name: Verify Formatting
        working-directory: ./apps/mobile
        run: flutter format --set-exit-if-changed .

      - name: Analyze Static Code
        working-directory: ./apps/mobile
        run: flutter analyze

      - name: Run Widget & Unit Tests
        working-directory: ./apps/mobile
        run: flutter test

  test-admin-web:
    name: Next.js Admin Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './apps/admin-web/package-lock.json'
          
      - name: Install Web Dependencies
        working-directory: ./apps/admin-web
        run: npm ci
        
      - name: Lint Next.js
        working-directory: ./apps/admin-web
        run: npm run lint
        
      - name: Build Web Target
        working-directory: ./apps/admin-web
        run: npm run build

  test-backend:
    name: NestJS API & Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './apps/api/package-lock.json'
          
      - name: Install API Dependencies
        working-directory: ./apps/api
        run: npm ci
        
      - name: Validate Prisma Schema
        working-directory: ./apps/api
        run: npx prisma validate
        
      - name: Run Mock Server Smoke Test
        working-directory: ./apps/api
        run: |
          node mock-server.js &
          sleep 3
          curl --fail http://localhost:3000/health || exit 1
          kill %1
